# =========================
# API & Dashboard
# =========================
api:
  dashboard: true
  insecure: false   # Ne pas exposer sans protection en prod

# =========================
# EntryPoints
# =========================
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"

# =========================
# Providers
# =========================
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: devops-network

# =========================
# Let's Encrypt
# =========================
certificatesResolvers:
  letsencrypt:
    acme:
      email: you@example.com
      storage: /acme.json
      httpChallenge:
        entryPoint: web

# =========================
# Logging (optionnel mais recommandé)
# =========================
log:
  level: INFO

accessLog: {}
