services:
  nexus:
    image: sonatype/nexus3:3.89.1
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    networks:
      - devops-network
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m
    volumes:
      - nexus-data:/nexus-data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

networks:
  devops-network:

volumes:
  nexus-data: