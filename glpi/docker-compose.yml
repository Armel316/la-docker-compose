services:
  db:
    image: mariadb:10.11
    container_name: glpi-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root_pass
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: glpi_pass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - devops-network

  glpi:
    image: glpi/glpi:latest
    container_name: glpi-app
    restart: always
    ports:
      - "8080:80"
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: glpi_pass
    volumes:
      - glpi_data:/var/www/html
    depends_on:
      - db
    networks:
      - devops-network
    ## Traefik usage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glpi.rule=Host(`glpi.local`)"
      - "traefik.http.services.glpi.loadbalancer.server.port=80"
      ## For security
      - "traefik.http.routers.glpi.entrypoints=websecure"
      - "traefik.http.routers.glpi.tls.certresolver=letsencrypt"

networks:
  devops-network:
    external: true

volumes:
  db_data:
  glpi_data: